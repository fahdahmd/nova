[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-assistant"
version = "1.0.0"
description = "Nova - a fully local, privacy-first voice and text personal AI assistant powered by Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Fahad Ahmad", email = "fahad28may@gmail.com" }]
keywords = ["ollama", "voice-assistant", "local-ai", "whisper", "piper", "fastapi", "privacy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  # --- web / async core ---
  "fastapi>=0.162,<0.170",
  # Pinned above the advisories fixed in 1.3.x (pip-audit gates CI on this).
  "starlette>=1.10,<2",
  "uvicorn[standard]>=0.34,<0.41",
  "websockets>=13.0",
  "python-multipart>=0.0.20",
  # --- validation & settings ---
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  # --- llm ---
  "ollama>=0.4.7",
  # --- speech ---
  "faster-whisper>=1.1.0",
  "piper-tts>=1.2.0",
  "webrtcvad-wheels>=2.0.14",
  "numpy>=1.26",
  # --- storage & scheduling ---
  "APScheduler>=3.10,<4",
  # --- tools ---
  "psutil>=6.0",
  "dateparser>=1.2",
  "ddgs>=9.0",
  "httpx>=0.27",
  # --- logging ---
  "structlog>=24.4",
]

[project.optional-dependencies]
wakeword = ["openwakeword>=0.6.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit[toml]>=1.8",
  "pip-audit>=2.7",
  "types-dateparser",
  "types-psutil",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/Fahad28may/nova"
Repository = "https://github.com/Fahad28may/nova"
Issues = "https://github.com/Fahad28may/nova/issues"

[project.scripts]
nova = "nova.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "S",    # bandit-ish security rules
  "ASYNC",
  "RUF",
]
ignore = [
  "S101",  # assert (used in tests)
  "B008",  # function call in default arg (FastAPI Depends idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["nova"]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/nova"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "piper.*",
  "webrtcvad.*",
  "openwakeword.*",
  "apscheduler.*",
  "ddgs.*",
  "ollama.*",
  "structlog.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

# ----------------------------------------------------------------------------
# bandit
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
