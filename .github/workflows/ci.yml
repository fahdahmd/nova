name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a developer .env or a stray model download affect CI.
  NOVA_STT_ENABLED: "false"
  NOVA_TTS_ENABLED: "false"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint and format check)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Mypy (strict)
        run: mypy

      - name: Bandit (security lint)
        run: bandit -c pyproject.toml -r src -q

      - name: Pytest
        run: pytest -q --cov=nova --cov-report=term-missing

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv pip install --system -e ".[dev]"

      - name: pip-audit
        run: pip-audit --strict --progress-spinner off

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  startup:
    name: smoke test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv pip install --system -e ".[dev]"

      - name: Start the app and check it serves
        env:
          NOVA_AUTH_TOKEN: ci_token_ci_token_ci_token_ci_token
          NOVA_OPEN_BROWSER: "false"
          NOVA_PORT: "8765"
        run: |
          python -m nova &
          APP_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health > /dev/null; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8765/api/health

          echo "--- the index must refuse an untokenized request ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = "401"

          echo "--- and serve the app with the token ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8765/?token=$NOVA_AUTH_TOKEN")" = "200"

          echo "--- the api must reject a foreign Host header ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' \
            -H "X-Nova-Token: $NOVA_AUTH_TOKEN" http://127.0.0.1:8765/api/state)" = "400"

          kill $APP_PID
