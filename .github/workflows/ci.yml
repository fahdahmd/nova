name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a developer .env or a stray model download affect CI.
  NOVA_STT_ENABLED: "false"
  NOVA_TTS_ENABLED: "false"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A virtual environment, not --system: the runner's own Python is
      # externally managed (PEP 668) and refuses installs.
      - name: Create the environment
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: .venv/bin/ruff check src tests scripts

      - name: Ruff (format check)
        run: .venv/bin/ruff format --check src tests scripts

      - name: Mypy (strict)
        run: .venv/bin/mypy

      - name: Bandit (security lint)
        run: .venv/bin/bandit -c pyproject.toml -r src -q

      - name: Pytest
        run: .venv/bin/pytest -q --cov=nova --cov-report=term-missing

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: pip-audit
        run: .venv/bin/pip-audit --strict --progress-spinner off

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install detect-secrets

      # detect-secrets over every tracked file. The gitleaks pre-commit hook
      # covers commit time; this is the gate that cannot be skipped.
      - name: Scan tracked files for secrets
        run: |
          git ls-files -z | xargs -0 .venv/bin/detect-secrets scan > secrets.json
          .venv/bin/python - <<'PY'
          import json
          import sys

          with open("secrets.json", encoding="utf-8") as handle:
              results = json.load(handle).get("results", {})

          if not results:
              print("No potential secrets found in tracked files.")
              sys.exit(0)

          for path, findings in sorted(results.items()):
              for finding in findings:
                  print(f"{path}:{finding.get('line_number')}  {finding.get('type')}")
          print(f"\n{len(results)} file(s) flagged.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Fail if a .env or database is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.sqlite3?$'; then
            echo "A secret or database file is tracked." >&2
            exit 1
          fi
          echo "No .env or database files are tracked."

  startup:
    name: smoke test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Start the app and check it serves
        env:
          NOVA_AUTH_TOKEN: ci_token_ci_token_ci_token_ci_token
          NOVA_OPEN_BROWSER: "false"
          NOVA_PORT: "8765"
        run: |
          .venv/bin/python -m nova &
          APP_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8765/api/health

          echo "--- the index must refuse an untokenized request ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = "401"

          echo "--- and serve the app with the token ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8765/?token=$NOVA_AUTH_TOKEN")" = "200"

          echo "--- the api must reject a foreign Host header ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' \
            -H "X-Nova-Token: $NOVA_AUTH_TOKEN" http://127.0.0.1:8765/api/state)" = "400"

          echo "--- and refuse a wrong token ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-Nova-Token: wrong_token_wrong_token_wrong_12" \
            http://127.0.0.1:8765/api/state)" = "401"

          echo "all checks passed"
          kill $APP_PID
